services:
  enbek-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enbek-mcp
    ports:
      - "8000:8000"
    environment:
      - ENBEK_HOST=0.0.0.0
      - ENBEK_PORT=8000
      - ENBEK_BASE_URL=https://enbek.kz
      - ENBEK_DEFAULT_LANG=ru
      - ENBEK_REQUEST_TIMEOUT=30
      - ENBEK_MAX_RETRIES=3
      - ENBEK_RATE_LIMIT_DELAY=1
    restart: unless-stopped
    # For development - mount source for hot reload
    # volumes:
    #   - ./src:/app/src
    #   - ./tsconfig.json:/app/tsconfig.json
    # command: npm run dev

  # Optional: Add a reverse proxy for production
